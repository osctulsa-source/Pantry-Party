# Dependency update automation. Replaces the fully-manual cadence flagged in the
# 2026-07-22 audit. Grouped, low-frequency PRs so review stays manageable.
version: 2
updates:
  # npm workspaces (root lockfile covers apps/mobile, services/api, packages/core).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Nest 12 peers require a coordinated @nestjs/common+core bump; Express
      # must stay on v5 via platform-express 11 (app.router).
      - dependency-name: "@nestjs/platform-express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/common"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/core"
        update-types: ["version-update:semver-major"]
      # v7 requires Node >=22.12; CI and the API image are Node 20.
      - dependency-name: "expo-server-sdk"
        update-types: ["version-update:semver-major"]
      # Sentry 11 drops `enableLogs` and moves auto-instrumentation to
      # module-load hooks; this ESM API then needs `node --import
      # @sentry/node/import` or tracing silently stops (#233). Migrate on purpose.
      - dependency-name: "@sentry/*"
        update-types: ["version-update:semver-major"]
      # The Expo SDK pins these native packages to specific minors. Moving them
      # independently (e.g. #236: react-native 0.85→0.87, worklets 0.8→0.12
      # under SDK 56) produces a binary Expo doesn't support — the class of
      # mismatch behind the TestFlight 41–46 crashes. They move only via
      # `npx expo install --fix` during a deliberate SDK upgrade.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-svg"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # Expo/React Native native surface is upgrade-sensitive — group so bumps
      # land together and get a single deliberate on-device QA pass.
      # Majors (SDK 56→57) are a dedicated upgrade, not a weekly PR.
      expo-react-native:
        patterns:
          - "expo*"
          - "react-native*"
          - "@expo/*"
          - "@react-native*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: development

  # Do NOT also watch /services/api as its own npm ecosystem. CI installs from
  # the root lockfile; API-only PRs fail `npm ci` (`Missing: <pkg> from lock
  # file`). Workspace bumps still change services/api/package.json; the image
  # lockfile is gated by the "Verify API image lockfile" CI step. Refresh
  # services/api/package-lock.json in the same PR when an API dep moves.

  # Local-dev + production Docker base/service images (e.g. powersync-service).
  - package-ecosystem: docker
    directory: "/infra/local-dev/docker"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/services/api"
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 20 until CI + engines + expo-server-sdk move together.
      # Jumping 20 → 26 skips Active LTS (22) and is not built in CI.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # CI action versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
