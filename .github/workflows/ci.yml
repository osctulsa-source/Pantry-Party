name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck apps/mobile
        run: npx tsc -p apps/mobile/tsconfig.json --noEmit

      - name: Typecheck services/api
        run: npm run typecheck -w services/api

      # Errors fail the build; the handful of deliberate exhaustive-deps
      # warnings (the `now`-refresh useMemo pattern) stay warnings.
      - name: Lint
        run: npm run lint

      - name: Test packages/core
        run: npm test -w packages/core

      - name: Test apps/mobile
        # Run from the app dir (not `-w`): the jest-expo preset resolves its
        # react-native plumbing relative to the working directory.
        run: npm test
        working-directory: apps/mobile

      - name: Test services/api
        # API_JWKS_URI is required at import-time by the auth middleware. The
        # unit tests don't exercise auth, but the import chain still triggers
        # the env check. Any URL satisfies the check.
        env:
          API_JWKS_URI: https://example.com/jwks.json
        run: npm test -w services/api

  # Railway/Docker builds the API image with `npm ci` against
  # services/api/package-lock.json, NOT the workspace root lockfile. This job
  # fails if a workspace bump left that image lockfile stale (the #224-#229
  # Dependabot pattern).
  #
  # It MUST be its own job. Run in the typecheck job (as #235 did), `npm ci`
  # from services/api resolves up to the workspace root and reinstalls there,
  # replacing all 1206 workspace packages with the API's 302 — every step after
  # it then failed with "Cannot find module 'react'". CI was red on main from
  # 2026-09-03 until this was split out.
  api-image-lockfile:
    name: API image lockfile is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json

      - name: npm ci against the image lockfile
        run: npm ci --no-audit --no-fund
        working-directory: services/api

  integration:
    name: Integration (real Postgres)
    runs-on: ubuntu-latest
    # Wire tests that run the real routes/controller against actual Postgres —
    # they catch SQL/DDL/constraint drift the mocked unit suites can't (e.g. the
    # household_invites.used_by uuid-coercion bug). The schema is the numbered
    # init-scripts baseline, applied by the suite's globalSetup.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Integration tests (services/api)
        env:
          PG_URI: postgres://postgres:postgres@localhost:5432/postgres
          API_JWKS_URI: https://example.com/jwks.json
        run: npm run test:integration -w services/api

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    # Runs the canonical ledger runner (infra/managed/migrate.sh) against a
    # throwaway Postgres, so a broken or non-idempotent migration fails the
    # build before it can reach production. Also asserts the runner is a no-op
    # on a second pass (the ledger claim works).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migrations (fresh DB)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: sh infra/managed/migrate.sh

      - name: Re-run is idempotent (ledger skips every file)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          out="$(sh infra/managed/migrate.sh)"
          echo "$out"
          if echo "$out" | grep -q '==> apply'; then
            echo "::error::migrate.sh re-applied a file on the second run — ledger is not idempotent"
            exit 1
          fi
