# Composed PowerSync Docker stack (generated by powersync docker configure).
# Modules add entries to include and to services.powersync.depends_on.
# Relative paths: . = powersync/docker, .. = powersync.
# Include syntax requires Docker Compose v2.20.3+

include:
  [
    modules/database-postgres/postgres.database.compose.yaml,
    modules/storage-postgres/postgres.storage.compose.yaml
  ]

services:
  powersync:
    restart: unless-stopped
    # Pinned for reproducible local dev (was :latest). Bumped via Dependabot
    # (.github/dependabot.yml → docker). Keep in step with PowerSync Cloud.
    image: journeyapps/powersync-service:1.21.0
    command: [ 'start', '-r', 'unified' ]
    env_file:
      - .env
    volumes:
      - ../service.yaml:/config/service.yaml
      - ../sync-config.yaml:/config/sync-config.yaml
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
    healthcheck:
      # PowerSync always listens on 8080 inside the container, regardless of
      # PS_PORT (which only controls the host-side port mapping below). Probe
      # the internal port, not the user-configurable host port.
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://localhost:8080/probes/liveness').then(r =>
          r.ok ? process.exit(0) : process.exit(1)).catch(() =>
          process.exit(1))"
      interval: 5s
      timeout: 1s
      retries: 15
    ports:
      # Host port is configurable via PS_PORT (default 8080); container side
      # is always 8080. Don't set PS_PORT=8081 — collides with Expo Metro.
      - '${PS_PORT:-8080}:8080'
    depends_on:
      {
        pg-db: { condition: service_healthy },
        pg-storage: { condition: service_healthy }
      }

  # ⚠ TEMPORARY upload-proxy. Replace with real backend per ADR-008.
  #    Drains PowerSync's local CRUD queue back to pg-db, handles household
  #    invites, and proxies Spoonacular recipe search (server-side key + per-
  #    user rate limit + 24h cache). See services/api/README.md.
  api:
    restart: unless-stopped
    build:
      context: ../../../services/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # The api container reaches the source-of-truth Postgres over the
      # docker network (pg-db is the service name from postgres.database).
      PG_URI: postgresql://${PS_DATABASE_USER}:${PS_DATABASE_PASSWORD}@pg-db:${PS_DATABASE_PORT}/${PS_DATABASE_NAME}
      # Same Supabase JWKS as PowerSync — one source of identity for the stack.
      API_JWKS_URI: ${PS_SUPABASE_JWKS_URI}
      API_PORT: ${API_PORT:-8090}
      # Spoonacular key for /recipes/search — SERVER-SIDE ONLY (never ship it
      # in the mobile bundle). Set SPOONACULAR_API_KEY in docker/.env; empty
      # value degrades recipe search to 503 without breaking the stack.
      SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY:-}
      # Sentry DSN for the api (optional) — Node project at sentry.io. Empty
      # disables error reporting without breaking the stack.
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:${API_PORT:-8090}/health']
      interval: 5s
      timeout: 2s
      retries: 15
    ports:
      - '${API_PORT:-8090}:${API_PORT:-8090}'
    depends_on:
      pg-db: { condition: service_healthy }
name: powersync_pantry-party
