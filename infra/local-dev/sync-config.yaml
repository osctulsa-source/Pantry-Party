# PowerSync sync rules — offline-sync spike (self-hosted)
# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Spike scope: stream every row of pantry_items to every connected client so the
# torture test can prove round-trip + merge. Per-household partitioning (auth
# fields) is a Phase 1 concern.

# See https://docs.powersync.com/sync/advanced/compatibility
config:
  edition: 3

streams:
  global:
    auto_subscribe: true
    queries:
      # Walking-skeleton scope: stream every column of pantry_items to every connected
      # client. Single UUID PK on `id` matches the production schema, so no synthetic
      # key is needed. Per-household partitioning (auth fields) is a Phase 1 concern.
      - SELECT * FROM pantry_items
