# PowerSync sync rules — household/user partitioning (ADRs 002, 003, and 010).
# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Each client connects with a Supabase user session JWT. PowerSync validates it
# against the Supabase JWKS (see service.yaml client_auth) and exposes the user
# id as auth.user_id() (the JWT `sub` claim). We use that to scope every
# replicated row to the user's household membership.
#
# Edition 3 (Sync Streams) syntax notes:
#   - Use `auth.user_id()` for JWT claims (NOT the legacy `request.user_id()`).
#   - There is no separate `parameters:` field and no `bucket.X` references —
#     edition 3 implicitly partitions buckets based on the query structure.
#     Use inline subqueries against join tables for partitioning instead.
#   - `subscription.parameter('key')` is for client-supplied values; we don't
#     use it here because household scoping is purely server-derived from JWT.

# See https://docs.powersync.com/sync/streams/overview
config:
  edition: 3

streams:
  # Household memberships: every membership row for the households the signed-in
  # user belongs to — the user's OWN memberships PLUS their co-members' (so the
  # app can list who's in a household and attribute activity by name; the
  # display_name lives on this row). Single-level subquery, the SAME scoping
  # shape as household_data — co-members are visible ONLY within shared
  # households, never cross-tenant. (Broadened from the prior self-only query in
  # the Display-names arc.)
  household_members:
    auto_subscribe: true
    query: |
      SELECT * FROM user_households
      WHERE household_id IN (
        SELECT household_id FROM user_households
        WHERE user_id = auth.user_id()
      )

  # Per-household data: pantry items, household metadata, the shared shopping
  # list, saved favorites, and the activity log — scoped to the households the
  # signed-in user is a member of. PowerSync implicitly creates one bucket per
  # (user, household) pair from the subquery, so users see ONLY rows whose
  # household_id matches a row they appear in via user_households — no
  # cross-tenant leakage.
  household_data:
    auto_subscribe: true
    queries:
      - |
        SELECT * FROM pantry_items
        WHERE household_id IN (
          SELECT household_id FROM user_households
          WHERE user_id = auth.user_id()
        )
      - |
        SELECT * FROM households
        WHERE id IN (
          SELECT household_id FROM user_households
          WHERE user_id = auth.user_id()
        )
      - |
        SELECT * FROM shopping_list_items
        WHERE household_id IN (
          SELECT household_id FROM user_households
          WHERE user_id = auth.user_id()
        )
      - |
        SELECT * FROM favorite_recipes
        WHERE household_id IN (
          SELECT household_id FROM user_households
          WHERE user_id = auth.user_id()
        )
      - |
        SELECT * FROM activity_events
        WHERE household_id IN (
          SELECT household_id FROM user_households
          WHERE user_id = auth.user_id()
        )
      - |
        SELECT * FROM announcements
        WHERE household_id IN (
          SELECT household_id FROM user_households
          WHERE user_id = auth.user_id()
        )
      - |
        SELECT * FROM announcement_reactions
        WHERE household_id IN (
          SELECT household_id FROM user_households
          WHERE user_id = auth.user_id()
        )

  # Per-user outstanding invites: streams ONLY invites the signed-in user
  # personally created (PR A of Shared Household). Invites created by other
  # members of the same household are deliberately NOT visible — reduces info
  # leak surface and keeps the UI scoped to "codes I generated". The /household
  # endpoints in services/api are the only writer of household_invites.
  user_invites:
    auto_subscribe: true
    queries:
      - |
        SELECT * FROM household_invites
        WHERE created_by = auth.user_id()

  # Per-user push tokens: a device push token is a secret and must NEVER stream
  # to co-members. Scoped strictly to the signed-in user's own rows, like
  # user_invites. The upload-proxy is the only writer besides the owning device.
  user_push_tokens:
    auto_subscribe: true
    queries:
      - |
        SELECT * FROM push_tokens
        WHERE user_id = auth.user_id()
